name: HOROS PROBE-1 CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run HOROS PROBE-1 Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize line endings for frozen artifact hashes
        run: |
          python -c "
          import os
          for root, _, files in os.walk('Research-002'):
              for f in files:
                  if f.endswith(('.json', '.csv')):
                      p = os.path.join(root, f)
                      with open(p, 'rb') as fp:
                          data = fp.read()
                      crlf = data.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
                      if crlf != data:
                          with open(p, 'wb') as fp:
                              fp.write(crlf)
          "

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy torch scipy==1.14.1

      - name: Execute Full Test Suite
        run: |
          PYTHONPATH=Research-002:Research-002/src pytest Research-002/tests -q

